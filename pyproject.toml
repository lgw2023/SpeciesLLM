[project]
name = "speciesllm-obs"
version = "0.1.0"
description = "SpeciesLLM data pipeline, scbasecount, and nanoBERT training scripts"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.23.5",
    "pandas==1.5.3",
    "pyarrow==16.0.0",
    "anndata==0.11.3",
    "dask[complete]==2023.12.1",
    "scanpy==1.10.1",
    "transformers==4.40.2",
    "torch==2.0.1",
    "torchtext==0.15.2",
    "torchdata==0.6.1",
    "toolz==1.0.0",
    "h5py>=3.10.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "zarr>=2.16.0",
    "numcodecs>=0.12.0",
    "packaging>=23.0",
    "typing-extensions>=4.8.0",
    "wandb==0.19.4",
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanoBERT"]

[tool.uv]
package = true
override-dependencies = [
    "torchtext==0.15.2",
]
