[workspace]
channels = ["pytorch", "nvidia", "pyg", "conda-forge"]
name = "mmgenedit-h200"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
install-flash-attn-h200 = "TORCH_CUDA_ARCH_LIST=9.0 MAX_JOBS=4 pip install 'flash-attn>=2.5.8,<3' --no-build-isolation"
install-lavis = "pip install --no-deps salesforce-lavis==1.0.2"

[dependencies]
python = "3.9.*"
pip = "*"
setuptools = "*"
wheel = "*"
packaging = "*"
pyyaml = "*"
tqdm = "*"
requests = "*"
spacy = "3.8.*"
pytorch = "2.3.1.*"
pytorch-cuda = "12.1.*"
torchvision = "0.18.1.*"
pyg = "2.6.1.*"
pytorch-lightning = "1.9.4.*"
torchmetrics = "*"
lightning-utilities = "*"
transformers = "4.43.1.*"
tokenizers = "0.19.*"
datasets = "3.6.*"
accelerate = "1.2.*"
peft = "0.10.*"
safetensors = "*"
huggingface_hub = "*"
numpy = "1.24.*"
scipy = "1.11.*"
pandas = "2.2.*"
scikit-learn = "1.6.*"
h5py = "*"
anndata = "0.10.*"
scanpy = "1.9.8.*"
pyarrow = "*"
numba = "0.57.*"
llvmlite = "0.40.*"
statsmodels = "*"
scikit-misc = "*"
umap-learn = "*"
leidenalg = "*"
louvain = "*"
python-igraph = "*"
natsort = "*"
matplotlib-base = "*"
seaborn = "*"
nltk = "*"
rouge-score = "*"
levenshtein = "*"
openpyxl = "*"
xlrd = "*"
mkl = "2023.*"
cuda-toolkit = "12.1.*"
cuda-nvcc = "12.1.*"
cuda-cudart-dev = "12.1.*"
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
psutil = "*"
cuda-cccl = "12.1.*"
dask = ">=2024.8.0,<2025"
wandb = ">=0.21.1,<0.22"

[pypi-dependencies]
fairscale = "==0.4.4"
